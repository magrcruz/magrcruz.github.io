bio: |
  I build production multi-agent LLM systems at EY's Generative AI Hub, and I research
  multimodal video understanding at the intersection of causal reasoning and affective
  computing. My work investigates why models that handle physical causal reasoning degrade
  when the causal subject is a human emotional state — a failure mode I identified during
  a Google Explore CSR fellowship and am now pursuing as a sustained research direction.
  First-author poster at the LatinX in Computer Vision (LXCV) Workshop, CVPR 2026.

